name: packager.io
on:
  push:
    branches:
      - develop*
      - stable*
      - mg-packager-io
  workflow_dispatch:

jobs:
  build:
    if: github.repository == 'zammad/zammad'
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: zammad
          POSTGRES_USER: zammad
          POSTGRES_PASSWORD: zammad
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        target:
          # - debian:11
          - debian:12
          # - ubuntu:20.04
          # - ubuntu:22.04
          # - el:9
          # - sles:15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup
        id: setup
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Package
        uses: pkgr/action/package@main
        id: package
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.setup.outputs.version }}
          debug: true
          env: |
            DATABASE_URL=postgres://zammad:zammad@127.0.0.1:5432/zammad
      - name: Publish
        uses: pkgr/action/publish@main
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.PACKAGER_PUBLISH_TOKEN }}
          repository: zammad/zammad
          channel: ${{ github.ref_name }}
          file: ${{ steps.package.outputs.package_path }}